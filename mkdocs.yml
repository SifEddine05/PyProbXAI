site_name: PyProbXAI
site_description: "Probable Explanations for Machine Learning Classifiers: Decision Trees, Tree Ensembles, and Black-Box Models"
site_author: "PyProbXAI Contributors"
site_url: "https://sifeddine05.github.io/PyProbXAI/"
repo_url: "https://github.com/SifEddine05/PyProbXAI"
repo_name: "SifEddine05/PyProbXAI"

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            separate_signature: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Scientific Methodology:
      - Overview: methodology/overview.md
      - Decision Trees (UAI 2023): methodology/decision-trees.md
      - Tree Ensembles (ECML PKDD 2026): methodology/tree-ensembles.md
      - Black-Box Models (BanditExplain): methodology/blackbox.md
  - Tutorials:
      - Decision Trees on Tabular Data: tutorials/decision-tree-adult.md
      - Random Forest & Majority Explanations: tutorials/random-forest-adult.md
      - Neural Network Explanations: tutorials/neural-network-adult.md
      - Image Heatmaps on MNIST: tutorials/cnn-mnist-heatmap.md
      - Text Classification with BE: tutorials/text-classification.md
  - API Reference:
      - Main Interface: api/main.md
      - Decision Trees: api/tree.md
      - Tree Ensembles: api/ensemble.md
      - Black-Box Models: api/blackbox.md
      - Explanation Object: api/explanation.md
      - Visual Displays: api/display.md
  - Citation: citation.md

