[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "PyProbXAI"
version = "0.1.0"
description = "Probable explanations for decision trees (UAI 2023), tree ensembles (k-pseudo) and black-box models (BE)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Sifeddine Sellami"},
    {name = "Florent Moulon"},
    {name = "Louenas Bounia"},
    {name = "Juba Agoun"}
]
keywords = [
    "explainable-ai",
    "xai",
    "probabilistic-explanations"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21.0",
    "scikit-learn>=1.0"
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "pymdown-extensions>=10.7,<12.2"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov"
]
examples = [
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "torch"
]
all = [
    "PyProbXAI[docs,test,examples]"
]

[project.urls]
Homepage = "https://github.com/SifEddine05/PyProbXAI/"
Documentation = "https://sifeddine05.github.io/PyProbXAI/"
Repository = "https://github.com/SifEddine05/PyProbXAI"
"Bug Tracker" = "https://github.com/SifEddine05/PyProbXAI/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["PyProbXAI*"]
